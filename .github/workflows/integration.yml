name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual trigger for testing
  workflow_dispatch:
  # Run weekly to catch API drift
  schedule:
    # Tuesday 06:00 UTC — failures land in EU/IN working hours, not weekend
    # handover. Aligns with the TS + Java SDK integration crons.
    - cron: '0 6 * * 2'

permissions:
  contents: read

# Avoid spawning parallel docker-compose stacks on back-to-back pushes;
# also cancels stale PR runs when a new commit lands. Push to main keys on SHA
# so main runs never queue or cancel each other.
concurrency:
  group: integration-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AXONFLOW_TELEMETRY: 'off'

jobs:
  # Contract tests run on all PRs and pushes - they don't need the stack
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout SDK
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Run Contract Tests
      run: go test -v -run "Contract" ./...

  # Integration tests only run on main branch (after merge) and scheduled runs
  # They require the community stack which needs docker compose
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run on main branch pushes, scheduled runs, or manual dispatch
    # Skip on PRs since community repo clone may fail without authentication
    if: github.event_name != 'pull_request'

    steps:
    - name: Checkout SDK
      uses: actions/checkout@v4

    # See the note on the wire-shape job: setup-go@v5 owns the module cache;
    # a manual actions/cache on ~/go/pkg/mod collides with its restore.
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: true

    - name: Clone Community Stack
      run: |
        git clone --depth 1 https://github.com/getaxonflow/axonflow.git ../axonflow

    - name: Start Community Stack
      run: |
        cd ../axonflow
        docker compose up -d --wait --wait-timeout 120

        # Belt-and-suspenders: also poll /health since not every compose
        # service has a healthcheck wired.
        echo "Waiting for agent to be healthy..."
        timeout 120 bash -c 'until curl -sf http://localhost:8080/health; do sleep 2; done'
        echo "Agent is healthy"

        timeout 60 bash -c 'until curl -sf http://localhost:8081/health; do sleep 2; done'
        echo "Orchestrator is healthy"

    - name: Run Unit Tests
      run: go test -v -race ./...

    - name: Run Integration Tests
      run: go test -v -tags=integration ./...
      env:
        AXONFLOW_AGENT_URL: http://localhost:8080
        AXONFLOW_CLIENT_ID: demo-client
        AXONFLOW_CLIENT_SECRET: demo-secret

    - name: Run Basic Example
      # `|| echo` was masking real failures (compile errors, panics,
      # connection refused). Demo creds against the community stack should
      # pass; if they don't, the smoke surfaces the regression.
      run: |
        cd examples/basic
        timeout 30 go run main.go
      env:
        AXONFLOW_AGENT_URL: http://localhost:8080
        AXONFLOW_CLIENT_ID: demo-client
        AXONFLOW_CLIENT_SECRET: demo-secret

    # Runtime proof that the smoke above is asserting something. The example
    # skips the LLM leg when no provider is configured; this leg pins the half
    # that IS observable without one, so that skip can never be widened into a
    # no-op without CI going red. Runs against the same live stack.
    - name: Run Runtime E2E — provider-absent governance
      run: go run runtime-e2e/provider_absent_governance/main.go
      env:
        AXONFLOW_E2E_PLATFORM_ENDPOINT: http://localhost:8080
        AXONFLOW_CLIENT_ID: demo-client
        AXONFLOW_CLIENT_SECRET: demo-secret

    # Logs MUST be captured before `Stop Community Stack` runs — `compose
    # down` destroys the containers and `compose logs` then returns
    # nothing. `if: failure()` here, `if: always()` on teardown.
    #
    # This step also WRITES the file the upload step consumes. It previously
    # only echoed to the console and the teardown step wrote the file, which
    # ran AFTER the upload — so the artifact had nothing to collect even
    # before the path was rejected.
    - name: Show Docker Logs on Failure
      if: failure()
      run: |
        if [ -d "../axonflow" ]; then
          cd ../axonflow
          docker compose logs --tail=200 || true
          # upload-artifact rejects any path containing '..', so stage the
          # file inside the workspace rather than beside the stack clone.
          docker compose logs --tail=500 > "${GITHUB_WORKSPACE}/docker-compose-logs.txt" 2>/dev/null || true
        fi

    - name: Upload Docker Logs on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: docker-compose-logs
        path: docker-compose-logs.txt
        if-no-files-found: ignore

    - name: Stop Community Stack
      if: always()
      run: |
        if [ -d "../axonflow" ]; then
          cd ../axonflow
          docker compose down --volumes --remove-orphans || true
        fi
