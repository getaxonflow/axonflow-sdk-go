name: heartbeat-real-stack

# Real-stack heartbeat E2E across Linux + Windows + macOS. Stands up a
# localhost fake checkpoint server, constructs the SDK through its
# public API, verifies (a) the OS-native stamp file appears, (b) the
# checkpoint endpoint received exactly one ping, (c) a second
# invocation does NOT re-fire (warm-cache regression).

on:
  # Full three-OS matrix on demand (see the matrix comment below).
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AXONFLOW_TELEMETRY: 'off'

permissions:
  contents: read

jobs:
  real-stack:
    name: real-stack ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # OS matrix by event (2026-09-03, CI-cost round 3): a macOS minute
        # counts TEN times and a Windows minute twice against the organisation's
        # Actions allowance, and this matrix ran all three on every PR push.
        # PRs now run the Linux leg; the full three-OS matrix runs on every
        # merge to main (push) and on workflow_dispatch, so cross-OS coverage
        # still lands on every merged commit rather than on every iteration.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # macos-latest runners abort Go 1.22-built binaries at exec time
          # ("dyld: missing LC_UUID load command", SIGABRT); newer Go
          # toolchains emit LC_UUID. 1.22 is EOL and never got the fix.
          go-version: '1.24.x'

      - name: Set up Python (for harness driver)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build smoke binary
        working-directory: tests/heartbeat-real-stack
        shell: bash
        run: |
          go mod tidy
          # Explicit .exe on Windows so the run step's path is unambiguous;
          # Go's `-o smoke_go` behavior on Windows is version-dependent.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            go build -o smoke_go.exe ./smoke_go.go
          else
            go build -o smoke_go ./smoke_go.go
          fi

      - name: Run real-stack heartbeat E2E (cold + warm)
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BIN="tests/heartbeat-real-stack/smoke_go.exe"
          else
            BIN="tests/heartbeat-real-stack/smoke_go"
          fi
          python tests/heartbeat-real-stack/run_real_stack.py "$BIN"
